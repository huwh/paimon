name: Community Digest

on:
  schedule:
    # Weekdays at 16:00 UTC, which is noon in US Eastern daylight time.
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: Hours of GitHub and mailing-list activity to include.
        required: false
        default: '24'
      dry-run:
        description: Print the digest to the workflow log instead of sending email.
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-digest:
    if: github.repository == 'apache/paimon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build and send digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGEST_LOOKBACK_HOURS: ${{ github.event.inputs['lookback-hours'] || '24' }}
          DIGEST_SMTP_HOST: ${{ secrets.DIGEST_SMTP_HOST }}
          DIGEST_SMTP_PORT: ${{ secrets.DIGEST_SMTP_PORT }}
          DIGEST_SMTP_USERNAME: ${{ secrets.DIGEST_SMTP_USERNAME }}
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          args=()
          if [ "${{ github.event.inputs['dry-run'] || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 tools/community_digest.py "${args[@]}"
